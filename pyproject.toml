[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-python-rpc-starter-kit"
version = "1.0.0"
description = "A beginner-friendly, dependency-free Python starter for Pocket Network JSON-RPC"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "MORRISON"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
